<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plants — every website grows differently</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #2c2a27;
        --muted: #7d7873;
        --line: #e0dbd3;
        --bg: #f7f3ec;
        --accent: #3f6b3a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 20px;
      }

      header { text-align: center; padding: 40px 0 22px; }
      h1 { font-size: 27px; font-weight: 620; letter-spacing: -0.02em; margin: 0 0 5px; }
      .tagline { color: var(--muted); margin: 0; font-size: 15px; }

      form { display: flex; gap: 9px; width: 100%; max-width: 480px; margin: 0 0 8px; }
      input {
        flex: 1; min-width: 0;
        padding: 11px 14px;
        font: inherit; color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        outline: none;
      }
      input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,107,58,.13); }
      button {
        padding: 11px 17px;
        font: inherit; font-weight: 560;
        color: #fff; background: var(--accent);
        border: 0; border-radius: 9px; cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) { background: #355c31; }
      button:disabled { opacity: .5; cursor: default; }

      main { width: 100%; max-width: 760px; flex: 1; display: flex; flex-direction: column; align-items: center; }

      .examples {
        display: flex; flex-wrap: wrap; gap: 6px;
        justify-content: center; align-items: baseline;
        font-size: 13px; color: var(--muted);
        max-width: 480px;
      }
      .examples button {
        padding: 3px 9px; font: inherit;
        color: var(--muted); background: transparent;
        border: 1px solid var(--line); border-radius: 20px;
        cursor: pointer; font-weight: 400;
      }
      .examples button:hover:not(:disabled) { color: var(--ink); border-color: #c9c2b7; background: #fdfbf7; }
      /* Retry is offered only where the failure is genuinely transient — a warm
         browser reads in 3-8s against 14-21s cold, so a second attempt often works. */
      #retry {
        margin-top: 14px; padding: 7px 16px; font: inherit; font-size: 14px;
        color: var(--ink); background: #fdfbf7; border: 1px solid #c9c2b7;
        border-radius: 999px; cursor: pointer;
      }
      #retry:hover { background: #fff; border-color: #a9a094; }

      .stage {
        width: 100%; aspect-ratio: 1 / 1; max-height: 62vh;
        margin-top: 14px;
        border: 1px solid var(--line); border-radius: 15px;
        overflow: hidden; position: relative;
        background: #eceade;
      }
      canvas { display: block; width: 100%; height: 100%; }

      .overlay {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 9px; text-align: center; padding: 26px;
        color: var(--muted);
      }
      .overlay[hidden] { display: none; }
      /* The failure message sits OVER the bare-earth island, so it needs a
         ground of its own — dark red on brown soil was close to unreadable.
         A judge put the principle well: an image can refuse to pass judgment on
         a site, but it cannot say "we could not read this"; that sentence has to
         be carried by the copy, so the copy has to be legible whatever is behind
         it. Only the error state gets the card; the idle and loading messages sit
         on a plain canvas and would look boxed-in. */
      .overlay.failed #msg, .overlay.failed #retry {
        background: rgba(253, 251, 247, 0.94);
        border: 1px solid #e4ded4;
        border-radius: 12px;
        padding: 12px 18px;
        max-width: 34em;
        box-shadow: 0 2px 14px rgba(60, 48, 36, 0.10);
      }
      .overlay.failed #retry { padding: 7px 16px; }
      .spinner {
        width: 19px; height: 19px; border-radius: 50%;
        border: 2px solid var(--line); border-top-color: var(--accent);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .result { width: 100%; padding: 15px 3px 40px; }
      .result[hidden] { display: none; }
      .domain { font-weight: 600; font-size: 16px; }
      .stamp { color: var(--muted); font-size: 13px; margin-left: 7px; font-weight: 400; }
      .why { margin: 11px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
      .why li { display: flex; gap: 9px; align-items: baseline; font-size: 14px; }
      .why b { font-weight: 560; min-width: 116px; }
      .why span { color: var(--muted); }
      .swatches { display: flex; gap: 5px; margin-left: 2px; }
      .sw { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(0,0,0,.14); }

      .err { color: #9a3b32; }
      .note {
        margin-top: 10px; padding: 8px 11px;
        background: #fdf4e3; border: 1px solid #ecdcb8; border-radius: 7px;
        color: #7a5c22; font-size: 13px;
      }
      footer { padding: 0 0 30px; color: var(--muted); font-size: 12.5px; }
      footer a { color: inherit; }
      @media (max-width: 560px) { form { flex-direction: column; } header { padding-top: 28px; } }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Plants</h1>
      <p class="tagline">Every website grows differently.</p>
    </header>

    <main>
      <form id="form">
        <input id="url" type="text" placeholder="news.ycombinator.com" autocomplete="off" spellcheck="false" autofocus />
        <button id="go" type="submit">Grow my website</button>
      </form>

      <div class="examples" id="examples">
        <span>or try</span>
        <!-- CHIPS MUST BE FAST, RELIABLE, THEN DIFFERENT — in that order (Taste).
             A suggestion WE chose failing is the worst outcome in the product,
             worse than having no chips at all, and retry does not rescue it
             because the user meets the failure before they meet the retry.
             stripe.com and github.com were both chips and both time out; the
             old placeholder was stripe.com too. Latency counts as reliability:
             daringfireball.net grows a lovely night tree but has been measured
             between 10s and 25s, so it is not a chip.
             Measured on the live path 2026-09-20 — state, then seconds:
               info.cern.ch          bare,   no flowers          3.8s
               news.ycombinator.com  sparse, orange #f37b2b      3.6s
               arxiv.org             normal, periwinkle #a1a1f8  4.1s
               gwern.net             normal, WINTER              9.1s
             Four states, warm and cool accents, one seasonal. Re-measure before
             changing any of them. -->
        <button type="button" data-site="info.cern.ch" title="essentially unstyled HTML">info.cern.ch</button>
        <button type="button" data-site="news.ycombinator.com" title="plain, with one strong accent">news.ycombinator.com</button>
        <button type="button" data-site="arxiv.org" title="dense and academic">arxiv.org</button>
        <button type="button" data-site="gwern.net" title="designed, and almost colourless">gwern.net</button>
      </div>

      <div class="stage">
        <canvas id="scene"></canvas>
        <div class="overlay" id="overlay">
          <div class="spinner" id="spinner" hidden></div>
          <div id="msg">Paste a website address to grow its tree.</div>
          <button type="button" id="retry" hidden>Try again</button>
        </div>
      </div>

      <div class="result" id="result" hidden>
        <div><span class="domain" id="domain"></span><span class="stamp" id="stamp"></span></div>
        <ul class="why" id="whyList"></ul>
        <div class="note" id="cacheNote" hidden></div>
      </div>
    </main>

    <footer><a href="/compare.html">comparison grid</a> · internal V0</footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
