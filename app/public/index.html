<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Plants — a little life from any website</title>
    <meta
      name="description"
      content="Give a website a little life. Grow a tree, stir its leaves, and share your own tiny world."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e7ebe5" />
    <!-- share-meta:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plants" />
    <meta
      property="og:title"
      content="Plants — a little life from any website"
    />
    <meta
      property="og:description"
      content="Every website grows differently. What will yours become?"
    />
    <meta property="og:url" content="https://sitebonsai.vercel.app/" />
    <meta property="og:image" content="https://sitebonsai.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Plants — a little life from any website"
    />
    <meta name="twitter:image" content="https://sitebonsai.vercel.app/og.png" />
    <!-- share-meta:end -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
    <link rel="modulepreload" href="/tree/main.js" />
    <link rel="modulepreload" href="/tree/grow.js" />
  </head>
  <body>
    <main id="garden">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="Interactive tree. Drag to turn, use arrow keys to orbit, or press Space to stir its leaves."
      ></canvas>
      <header class="masthead">
        <div>
          <h1>plants<span class="wordmark-dot">.</span></h1>
          <p>a little life from any website</p>
        </div>
        <button
          id="motion"
          class="quiet-button"
          type="button"
          aria-pressed="false"
        >
          Pause motion
        </button>
      </header>
      <div class="garden-controls">
        <section class="result" id="result" hidden aria-label="Your tree">
          <div class="tree-label">
            <span id="caption" class="eyebrow">GROWN FROM</span
            ><span id="domain"></span>
          </div>
          <button
            id="shareBtn"
            class="share-button"
            type="button"
            aria-haspopup="dialog"
          >
            Share tree <span aria-hidden="true">↗</span>
          </button>
        </section>
        <section class="dock" aria-label="Grow a tree">
          <form id="form" novalidate>
            <label for="url">Plant a website</label>
            <div class="input-row">
              <input
                id="url"
                type="text"
                inputmode="url"
                placeholder="your-website.com"
                autocomplete="url"
                spellcheck="false"
                aria-describedby="status"
              />
              <button id="go" type="submit">
                Grow a tree <span aria-hidden="true">↗</span>
              </button>
            </div>
          </form>
          <div class="status-row">
            <span id="status" role="status" aria-live="polite"
              >Every website grows differently.</span
            ><button id="retry" type="button" hidden>Try again</button>
          </div>
        </section>
        <p class="footnote">a small corner of the internet, growing</p>
      </div>
      <div class="notice" id="notice" role="status" hidden></div>
    </main>
    <dialog id="shareDialog" aria-labelledby="shareTitle">
      <div class="dialog-heading">
        <div>
          <span class="eyebrow">A LITTLE SOMETHING TO KEEP</span>
          <h2 id="shareTitle">Send a little life.</h2>
        </div>
        <button
          id="closeShare"
          class="close-button"
          aria-label="Close share dialog"
        >
          ×
        </button>
      </div>
      <div class="card-preview">
        <img id="sharePreview" alt="Your tree’s share card" hidden />
        <p id="previewStatus" role="status">Making your postcard…</p>
      </div>
      <p id="shareStatus" role="status">Your tree, just as you left it.</p>
      <div class="share-actions">
        <a
          id="postX"
          class="primary-action"
          target="_blank"
          rel="noopener noreferrer"
          aria-disabled="true"
          >Share on X ↗</a
        >
        <button id="copyLink" type="button" disabled>Copy link</button>
        <button id="saveImage" type="button" disabled>Save image</button>
      </div>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
